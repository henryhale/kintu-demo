[project]
name = "kintu"
version = "0.1.0"
description = "Chat in Luganda with henryhale/Kintu-1.0-39M."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "streamlit>=1.61.1",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
